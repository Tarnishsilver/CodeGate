version: '3.8'

services:
  codegate-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codegate-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CODEGATE_PYTHON=python3
    depends_on:
      - redis
    restart: always

  redis:
    image: redis:7-alpine
    container_name: codegate-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: always

volumes:
  redis-data:
